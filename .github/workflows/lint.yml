name: Lint & Test

on:
  push:
    branches:
    - main
    - release/*
  pull_request:
    branches:
    - main
    - release/*

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint -- --quiet

      - name: Run build
        run: npm run build
